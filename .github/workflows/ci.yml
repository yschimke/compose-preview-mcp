name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A pull request cancels its own superseded runs; a push to `main` never cancels another.
concurrency:
  group: ci-${{ github.event_name == 'push' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The required check (yschimke/renovate-config `repo-policy/policy.json`).
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: ${{ github.event_name != 'push' }}
      - name: Check the borrowed MCP App pages against their provenance
        run: python3 scripts/update-server-assets.py --check
      - run: ./gradlew check ktfmtCheckAll :mcp:distTar
      - name: Smoke-test the distribution
        run: |
          set -euo pipefail
          archive="$(ls mcp/build/distributions/compose-preview-mcp-*.tar.gz)"
          work="$(mktemp -d)"
          tar -xzf "$archive" -C "$work"
          root="$(ls -d "$work"/compose-preview-mcp-*)"
          test -x "$root/bin/compose-preview-mcp"
          test -f "$root/java-min.properties"
          test -f "$root/ui-builder/compose-preview-ui-builder-web.zip"
      - name: Upload test reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-reports
          path: mcp/build/reports/tests/

  # The opt-in `-PuiBuilderRemoteCompose=true` build: `McpBuildFeatures.remoteCompose` turns the
  # Remote Compose authoring tools on, and no release enables it, so this is its only coverage.
  remote-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-provider: basic
          cache-read-only: true
      - run: ./gradlew -PuiBuilderRemoteCompose=true :mcp:test

  # The `.rc` viewer MCP App (`mcp-app/rc-viewer.html`) behind a fake MCP Apps host.
  rc-viewer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
      - run: npm ci
        working-directory: harness
      - run: npx playwright install --with-deps chromium
        working-directory: harness
      - run: npm run rc-viewer
        working-directory: harness
