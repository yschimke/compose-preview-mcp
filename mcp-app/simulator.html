<!doctype html>
<html lang="en" data-simulator-state="idle">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Android Simulator</title>
<!--
  Interactive Android Simulator MCP App (ui://compose-preview/simulator) and standalone sidebar UI.

  Displays the live screen(s) of an Android app running in Robolectric's simulator
  (`simulator_*` tools in compose-preview-mcp), including paired phone + watch sessions
  side-by-side, and lets the user tap, long-press, swipe, type text, press Back/Home, reload
  edits, restart, stop, and inspect logs/events.

  Works over either:
  - MCP Apps postMessage JSON-RPC 2.0 (inline host card), or
  - Same-origin HTTP bridge (`/api/simulators` or `?transport=http&apiBase=/__sidecar/sim`) for
    sidebar hosts such as Antigravity's Auxiliary Pane sidecar.
-->
<style>
  :root {
    color-scheme: light dark;
    font: 13px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --fg: var(--color-text-primary, #1b1b1f);
    --fg-2: var(--color-text-secondary, #5f6168);
    --bg: var(--color-background-primary, #ffffff);
    --bg-2: var(--color-background-secondary, #f4f4f7);
    --border: var(--color-border, #d8d8dd);
    --danger: var(--color-text-danger, #c5221f);
    --danger-bg: var(--color-background-danger, #fce8e6);
    --accent: #2e7d32;
    --accent-fg: #ffffff;
    color: var(--fg);
    background: var(--bg);
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --fg: var(--color-text-primary, #e6e6ea);
    --fg-2: var(--color-text-secondary, #a4a6ad);
    --bg: var(--color-background-primary, #17181b);
    --bg-2: var(--color-background-secondary, #222328);
    --border: var(--color-border, #3a3c42);
    --danger: var(--color-text-danger, #f28b82);
    --danger-bg: var(--color-background-danger, #3c1f1d);
    --accent: #3ddc84;
    --accent-fg: #0b1f13;
  }
  :root[data-theme="light"] { color-scheme: light; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); }
  .app { padding: 8px; display: grid; gap: 8px; }
  .bar { display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; min-width: 0; }
  .title-group { display: flex; align-items: center; gap: 6px; min-width: 0; flex: 1 1 10em; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--fg-2); flex: none; }
  .dot.running { background: var(--accent); }
  .dot.error { background: var(--danger); }
  .title { font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .badge {
    font-size: 11px; padding: 1px 6px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--bg-2); color: var(--fg-2);
    white-space: nowrap;
  }
  .status { color: var(--fg-2); font-size: 12px; white-space: nowrap; }
  button, select, input { font: inherit; color: inherit; }
  button, select {
    font-size: 12px; padding: 4px 9px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg-2); cursor: pointer;
  }
  button:hover:not(:disabled) { filter: brightness(0.96); }
  :root[data-theme="dark"] button:hover:not(:disabled) { filter: brightness(1.12); }
  button:disabled { opacity: 0.48; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); font-weight: 600; }
  button.active { border-color: var(--accent); color: var(--accent); }
  button.danger { color: var(--danger); }
  .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .text-row { display: flex; gap: 6px; align-items: center; }
  .text-row input[type="text"] {
    flex: 1 1 auto; min-width: 0; padding: 4px 8px; border-radius: 6px;
    border: 1px solid var(--border); background: var(--bg);
  }
  .stage {
    border: 1px solid var(--border); border-radius: 10px; background: var(--bg-2);
    display: grid; place-items: center; min-height: 180px; padding: 10px;
    overflow: auto; position: relative;
  }
  .screens {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: flex-start;
    justify-content: center; width: 100%;
  }
  .screens[hidden] { display: none; }
  .device-card {
    display: flex; flex-direction: column; align-items: center; gap: 6px;
    max-width: 100%;
  }
  .device-label {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 600; color: var(--fg-2);
    padding: 2px 8px; border-radius: 999px;
    border: 1px solid var(--border); background: var(--bg);
    cursor: pointer; user-select: none;
  }
  .device-card.selected .device-label {
    border-color: var(--accent); color: var(--accent);
  }
  .device-dims { font-weight: 400; opacity: 0.8; }
  .screen-wrap {
    position: relative; display: inline-block; line-height: 0;
    border-radius: 12px; overflow: hidden;
    box-shadow: 0 2px 12px rgba(0, 0, 0, 0.18);
    border: 1px solid var(--border);
    user-select: none; touch-action: none;
  }
  .device-card.selected .screen-wrap {
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 2px 12px rgba(0, 0, 0, 0.18);
  }
  .device-card[data-device="watch"] .screen-wrap,
  .device-card[data-device^="watch/"] .screen-wrap {
    border-radius: 28px;
  }
  .screen-wrap img {
    display: block; max-width: 100%; max-height: 64vh; width: auto; height: auto;
    cursor: crosshair; -webkit-user-drag: none;
  }
  .screens.paired .device-card[data-device="phone"] .screen-wrap img,
  .screens.paired .device-card[data-device^="phone/"] .screen-wrap img {
    max-height: 58vh;
  }
  .screens.paired .device-card[data-device="watch"] .screen-wrap img,
  .screens.paired .device-card[data-device^="watch/"] .screen-wrap img {
    max-height: 220px;
  }
  .ripple {
    position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px;
    border-radius: 50%; border: 2px solid var(--accent);
    background: rgba(61, 220, 132, 0.25); pointer-events: none;
    animation: sim-ripple 0.45s ease-out forwards;
  }
  @keyframes sim-ripple {
    from { transform: scale(0.4); opacity: 1; }
    to { transform: scale(1.8); opacity: 0; }
  }
  .notice {
    width: 100%; padding: 8px 10px; border-radius: 0 8px 8px 0;
    border-left: 4px solid var(--danger); background: var(--danger-bg);
  }
  .notice[hidden] { display: none; }
  .notice strong { color: var(--danger); display: block; }
  .notice p { margin: 3px 0 0; overflow-wrap: anywhere; }
  .empty { color: var(--fg-2); text-align: center; padding: 20px 12px; }
  .empty code { font-size: 12px; }
  .hint { color: var(--fg-2); font-size: 11px; }
  details.drawer { border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; }
  details.drawer summary { cursor: pointer; font-weight: 600; font-size: 12px; }
  .drawer-bar { display: flex; gap: 6px; align-items: center; margin: 6px 0; }
  pre.log-view {
    margin: 0; padding: 8px; border-radius: 6px; border: 1px solid var(--border);
    background: var(--bg-2); font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    max-height: 200px; overflow: auto; white-space: pre-wrap; word-break: break-word;
  }
</style>
<body>
<div class="app">
  <div class="bar">
    <div class="title-group">
      <span class="dot" id="dot" aria-hidden="true"></span>
      <span class="title" id="title">Android Simulator</span>
      <span class="badge" id="sim-badge" hidden></span>
    </div>
    <select id="sim-select" aria-label="Running simulator" hidden></select>
    <select id="device-select" aria-label="Target device" hidden></select>
    <span class="status" id="status" role="status" aria-live="polite">Waiting for simulator…</span>
  </div>

  <div class="controls">
    <button type="button" id="btn-back" disabled>Back</button>
    <button type="button" id="btn-home" disabled>Home</button>
    <button type="button" id="btn-refresh" disabled>Refresh</button>
    <button type="button" id="btn-live" disabled aria-pressed="false">Live</button>
    <button type="button" id="btn-reload" disabled>Reload</button>
    <button type="button" id="btn-restart" disabled>Restart</button>
    <button type="button" id="btn-stop" class="danger" disabled>Stop</button>
    <button type="button" id="btn-ask" class="primary" disabled>Ask agent</button>
  </div>

  <div class="notice" id="notice" hidden>
    <strong id="notice-title">Simulator error</strong>
    <p id="notice-body"></p>
  </div>

  <div class="stage" id="stage">
    <div class="screens" id="screens" hidden></div>
    <div class="empty" id="empty">
      Launch an app with <code>simulator_launch</code> or capture a frame with
      <code>simulator_screenshot</code>.
    </div>
  </div>

  <form class="text-row" id="text-form">
    <input type="text" id="text-input" placeholder="Type text into focused field…" disabled aria-label="Text to send to simulator">
    <button type="submit" id="btn-send-text" disabled>Send</button>
    <button type="button" id="btn-enter" disabled>Enter</button>
  </form>
  <div class="hint" id="hint">Click to tap · Drag to swipe · Shift+click or hold to long-press</div>

  <details class="drawer" id="drawer">
    <summary id="drawer-summary">Events &amp; logs</summary>
    <div class="drawer-bar">
      <button type="button" id="btn-logs" disabled>Load logs</button>
      <span class="status" id="meta-info"></span>
    </div>
    <pre class="log-view" id="log-view">No events yet.</pre>
  </details>
</div>
<script>
(() => {
  'use strict';
  const REQUEST_TIMEOUT_MS = 60000;
  const RESULT_META = 'compose-preview/simulator';
  const DRAG_THRESHOLD_PX = 12;
  const LONG_PRESS_MS = 550;
  const LIVE_POLL_MS = 2000;
  const DISCOVERY_POLL_MS = 2500;
  const MAX_EVENT_LINES = 40;
  const DEFAULT_DEVICE_KEY = '__default__';

  const queryParams = new URLSearchParams(window.location.search);
  const bridgeToken = queryParams.get('token') || '';
  if (bridgeToken && window.history?.replaceState) {
    const cleaned = new URL(window.location.href);
    cleaned.searchParams.delete('token');
    window.history.replaceState(null, '', cleaned.toString());
  }
  const rawApiBase =
    (typeof window.__SIMULATOR_API_BASE__ === 'string' && window.__SIMULATOR_API_BASE__) ||
    queryParams.get('apiBase') ||
    '/api/simulators';
  const apiBase = rawApiBase.startsWith('/') ? rawApiBase.replace(/\/+$/, '') : '/api/simulators';
  const isHttpTransport =
    queryParams.get('transport') === 'http' ||
    typeof window.__SIMULATOR_API_BASE__ === 'string' ||
    (window.parent === window && window.location.protocol.startsWith('http'));

  function httpHeaders(extra = {}) {
    const headers = { ...extra };
    if (bridgeToken) headers['X-Simulator-Token'] = bridgeToken;
    return headers;
  }

  const $ = id => document.getElementById(id);
  const root = document.documentElement;
  const dot = $('dot');
  const titleEl = $('title');
  const simBadge = $('sim-badge');
  const simSelect = $('sim-select');
  const deviceSelect = $('device-select');
  const statusEl = $('status');
  const noticeEl = $('notice');
  const noticeTitle = $('notice-title');
  const noticeBody = $('notice-body');
  const screensEl = $('screens');
  const emptyEl = $('empty');
  const hintEl = $('hint');
  const textForm = $('text-form');
  const textInput = $('text-input');
  const btnBack = $('btn-back');
  const btnHome = $('btn-home');
  const btnRefresh = $('btn-refresh');
  const btnLive = $('btn-live');
  const btnReload = $('btn-reload');
  const btnRestart = $('btn-restart');
  const btnStop = $('btn-stop');
  const btnAsk = $('btn-ask');
  const btnSendText = $('btn-send-text');
  const btnEnter = $('btn-enter');
  const btnLogs = $('btn-logs');
  const logView = $('log-view');
  const metaInfo = $('meta-info');

  const pending = new Map();
  const screenCards = new Map(); // deviceKey -> { card, wrap, img, dims }
  let nextId = 1;
  let initialized = false;
  let busy = false;
  let liveTimer = null;
  let discoveryTimer = null;
  let lastHeight = 0;
  let lastContextSummary = '';
  let dragStart = null;

  const state = {
    simulatorId: null,
    simulators: [],
    appName: null,
    device: null,
    devices: [],
    running: false,
    lastPackage: null,
    lastActivity: null,
    lastAction: null,
    events: [],
    logs: [],
  };

  if (isHttpTransport) {
    btnAsk.hidden = true;
  }

  // ---------------------------------------------------------------------------------------------
  // MCP Apps bridge (postMessage JSON-RPC 2.0)
  // ---------------------------------------------------------------------------------------------

  function request(method, params, timeoutMs = REQUEST_TIMEOUT_MS) {
    const id = nextId++;
    return new Promise((resolve, reject) => {
      const timer = setTimeout(() => {
        if (pending.delete(id)) reject(new Error(`${method} timed out after ${timeoutMs} ms`));
      }, timeoutMs);
      pending.set(id, { resolve, reject, timer });
      window.parent.postMessage({ jsonrpc: '2.0', id, method, params }, '*');
    });
  }

  function notify(method, params) {
    if (isHttpTransport) return;
    window.parent.postMessage({ jsonrpc: '2.0', method, params }, '*');
  }

  window.addEventListener('message', event => {
    if (event.source !== window.parent) return;
    const message = event.data;
    if (!message || message.jsonrpc !== '2.0') return;
    if (message.id != null && !message.method) {
      const waiter = pending.get(message.id);
      if (!waiter) return;
      pending.delete(message.id);
      clearTimeout(waiter.timer);
      if (message.error) waiter.reject(new Error(message.error.message || 'request failed'));
      else waiter.resolve(message.result);
      return;
    }
    switch (message.method) {
      case 'ui/notifications/tool-input':
        onToolInput(message.params?.arguments || {});
        break;
      case 'ui/notifications/tool-result':
        onToolResult(message.params?.result || message.params || {});
        break;
      case 'ui/notifications/host-context-changed':
        applyHostContext(message.params || {});
        break;
      default:
        break;
    }
  });

  async function initializeBridge() {
    if (isHttpTransport) {
      initialized = true;
      syncControls();
      await pollHttpSimulators();
      discoveryTimer = setInterval(() => {
        void pollHttpSimulators();
      }, DISCOVERY_POLL_MS);
      return;
    }
    try {
      const result = await request('ui/initialize', {
        appInfo: { name: 'compose-preview-simulator', version: '1' },
        appCapabilities: {},
        protocolVersion: '2026-01-26',
      });
      initialized = true;
      applyHostContext(result?.hostContext || {});
      notify('ui/notifications/initialized', {});
      syncControls();
      reportSize();
    } catch (err) {
      setStatus(`Bridge unavailable: ${err.message}`);
    }
  }

  function applyHostContext(context) {
    const theme = context?.theme;
    if (theme === 'dark' || theme === 'light') {
      root.dataset.theme = theme;
    }
    const vars = context?.styles?.variables;
    if (vars && typeof vars === 'object') {
      for (const [k, v] of Object.entries(vars)) {
        if (typeof k === 'string' && k.startsWith('--') && typeof v === 'string') {
          root.style.setProperty(k, v);
        }
      }
    }
  }

  function reportSize() {
    if (!initialized || isHttpTransport) return;
    const height = Math.ceil(document.documentElement.scrollHeight);
    if (height > 0 && Math.abs(height - lastHeight) >= 2) {
      lastHeight = height;
      notify('ui/notifications/size-changed', { height });
    }
  }

  if (typeof ResizeObserver !== 'undefined') {
    new ResizeObserver(() => reportSize()).observe(document.body);
  }

  // ---------------------------------------------------------------------------------------------
  // Screen cards (single or paired side-by-side)
  // ---------------------------------------------------------------------------------------------

  function activeDeviceKeys() {
    if (Array.isArray(state.devices) && state.devices.length > 0) {
      return state.devices;
    }
    return [DEFAULT_DEVICE_KEY];
  }

  function isPaired() {
    return Array.isArray(state.devices) && state.devices.length > 1;
  }

  function ensureScreenCard(deviceKey) {
    let entry = screenCards.get(deviceKey);
    if (entry) return entry;

    const card = document.createElement('div');
    card.className = 'device-card';
    card.dataset.device = deviceKey;

    const label = document.createElement('div');
    label.className = 'device-label';
    const labelName = document.createElement('span');
    labelName.textContent = deviceKey === DEFAULT_DEVICE_KEY ? 'device' : deviceKey;
    const dims = document.createElement('span');
    dims.className = 'device-dims';
    label.append(labelName, dims);
    label.hidden = !isPaired();
    label.addEventListener('click', () => {
      if (deviceKey !== DEFAULT_DEVICE_KEY) {
        selectActiveDevice(deviceKey);
      }
    });

    const wrap = document.createElement('div');
    wrap.className = 'screen-wrap';

    const img = document.createElement('img');
    img.alt = deviceKey === DEFAULT_DEVICE_KEY
      ? 'Android Simulator display'
      : `Android Simulator ${deviceKey} display`;
    img.draggable = false;
    img.dataset.device = deviceKey;

    attachPointerHandlers(img, wrap, deviceKey);
    img.addEventListener('load', () => {
      if (img.naturalWidth && img.naturalHeight) {
        dims.textContent = `${img.naturalWidth}×${img.naturalHeight}`;
      }
      renderDrawer();
      reportSize();
    });

    wrap.appendChild(img);
    card.append(label, wrap);
    screensEl.appendChild(card);

    entry = { card, label, dims, wrap, img };
    screenCards.set(deviceKey, entry);
    return entry;
  }

  function syncScreenCards() {
    const keys = activeDeviceKeys();
    const keySet = new Set(keys);
    for (const [k, entry] of screenCards.entries()) {
      if (!keySet.has(k)) {
        entry.card.remove();
        screenCards.delete(k);
      }
    }
    screensEl.classList.toggle('paired', keys.length > 1);
    for (const k of keys) {
      const entry = ensureScreenCard(k);
      entry.label.hidden = keys.length <= 1;
      entry.card.classList.toggle(
        'selected',
        keys.length > 1 && state.device === k,
      );
    }
  }

  function selectActiveDevice(device) {
    if (!device || state.device === device) return;
    state.device = device;
    if (deviceSelect.options.length > 0) {
      deviceSelect.value = device;
    }
    syncScreenCards();
  }

  function setImageBase64(b64, device) {
    if (!b64 || typeof b64 !== 'string') return;
    syncScreenCards();
    const key = (device && isPaired())
      ? device
      : (isPaired() ? (state.device || state.devices[0]) : DEFAULT_DEVICE_KEY);
    const entry = ensureScreenCard(key);
    entry.img.src = `data:image/png;base64,${b64}`;
    screensEl.hidden = false;
    emptyEl.hidden = true;
    reportSize();
  }

  // ---------------------------------------------------------------------------------------------
  // UI state helpers
  // ---------------------------------------------------------------------------------------------

  function setStatus(text) {
    statusEl.textContent = text;
  }

  function showNotice(title, body) {
    noticeTitle.textContent = title;
    noticeBody.textContent = body;
    noticeEl.hidden = false;
    dot.className = 'dot error';
    reportSize();
  }

  function clearNotice() {
    noticeEl.hidden = true;
  }

  function isPermissionOrDisabledError(err) {
    const msg = String(err?.message || err || '').toLowerCase();
    return msg.includes('permission_denied') || msg.includes('is disabled');
  }

  function syncControls() {
    const active = state.running && !busy;
    root.dataset.simulatorState = state.running ? (busy ? 'busy' : 'running') : 'idle';
    dot.className = state.running ? 'dot running' : 'dot';
    titleEl.textContent = state.appName || state.lastPackage || 'Android Simulator';
    if (state.simulatorId) {
      simBadge.textContent = state.simulatorId;
      simBadge.hidden = false;
    } else {
      simBadge.hidden = true;
    }
    for (const btn of [btnBack, btnHome, btnLive, btnReload, btnRestart, btnStop, btnSendText, btnEnter, btnLogs]) {
      btn.disabled = !active;
    }
    btnRefresh.disabled = !initialized || busy || (isHttpTransport && !state.simulatorId);
    textInput.disabled = !active;
    btnAsk.disabled = !state.running || busy;
    if (!state.running && liveTimer) {
      stopLive();
    }
    syncDevicePicker();
    syncScreenCards();
  }

  function syncSimPicker() {
    if (!isHttpTransport || state.simulators.length <= 1) {
      simSelect.hidden = true;
      return;
    }
    const ids = state.simulators.map(s => s.id);
    const existing = Array.from(simSelect.options).map(o => o.value);
    if (existing.join(',') !== ids.join(',')) {
      simSelect.textContent = '';
      for (const sim of state.simulators) {
        const opt = document.createElement('option');
        opt.value = sim.id;
        opt.textContent = sim.apk ? `${sim.id} (${sim.apk})` : sim.id;
        simSelect.appendChild(opt);
      }
    }
    if (state.simulatorId) simSelect.value = state.simulatorId;
    simSelect.hidden = false;
  }

  function syncDevicePicker() {
    const list = state.devices;
    if (!Array.isArray(list) || list.length <= 1) {
      deviceSelect.hidden = true;
      return;
    }
    const current = state.device && list.includes(state.device) ? state.device : list[0];
    const existing = Array.from(deviceSelect.options).map(o => o.value);
    if (existing.join(',') !== list.join(',')) {
      deviceSelect.textContent = '';
      for (const dev of list) {
        const opt = document.createElement('option');
        opt.value = dev;
        opt.textContent = dev;
        deviceSelect.appendChild(opt);
      }
    }
    deviceSelect.value = current;
    state.device = current;
    deviceSelect.hidden = false;
  }

  function appendEvents(events) {
    if (!Array.isArray(events) || !events.length) return;
    for (const evt of events) {
      const text = typeof evt === 'string' ? evt : JSON.stringify(evt);
      state.events.push(text);
    }
    if (state.events.length > MAX_EVENT_LINES) {
      state.events = state.events.slice(-MAX_EVENT_LINES);
    }
    renderDrawer();
  }

  function renderDrawer() {
    const parts = [];
    if (state.events.length) {
      parts.push('--- Events ---', ...state.events);
    }
    if (state.logs.length) {
      parts.push('--- Logs ---', ...state.logs);
    }
    logView.textContent = parts.length ? parts.join('\n') : 'No events yet.';
    const details = [];
    if (state.lastPackage) details.push(state.lastPackage);
    if (state.lastActivity) details.push(state.lastActivity);
    const activeEntry = screenCards.get(
      isPaired() ? (state.device || state.devices[0]) : DEFAULT_DEVICE_KEY,
    );
    if (activeEntry?.img?.naturalWidth && activeEntry?.img?.naturalHeight) {
      details.push(`${activeEntry.img.naturalWidth}×${activeEntry.img.naturalHeight}`);
    }
    metaInfo.textContent = details.join(' · ');
  }

  /**
   * Report only explicit user-initiated interactions back to the host model context,
   * deduplicated so repeated refreshes or passive tool results never accumulate context chips.
   */
  function updateModelContext() {
    if (isHttpTransport || !initialized || !state.simulatorId) return;
    const summary = [
      `Android Simulator ${state.simulatorId} (${state.running ? 'running' : 'stopped'})`,
      state.lastPackage ? `package=${state.lastPackage}` : null,
      state.lastActivity ? `activity=${state.lastActivity}` : null,
      state.device ? `device=${state.device}` : null,
      state.lastAction ? `lastAction=${state.lastAction}` : null,
    ].filter(Boolean).join(', ');
    if (summary === lastContextSummary) return;
    lastContextSummary = summary;
    request('ui/update-model-context', {
      content: [{ type: 'text', text: summary }],
    }).catch(() => {});
  }

  // ---------------------------------------------------------------------------------------------
  // Tool input & result handling
  // ---------------------------------------------------------------------------------------------

  function onToolInput(args) {
    if (!args || typeof args !== 'object') return;
    if (typeof args.simulator === 'string' && args.simulator) {
      state.simulatorId = args.simulator;
    }
    if (typeof args.device === 'string' && args.device) {
      state.device = args.device;
    }
    if (typeof args.cmd === 'string') {
      setStatus(`Running ${args.cmd}…`);
    }
  }

  function extractPngFromResult(result) {
    const meta = result?._meta?.[RESULT_META];
    if (meta && typeof meta.pngBase64 === 'string' && meta.pngBase64) {
      return meta.pngBase64;
    }
    const content = result?.content;
    if (Array.isArray(content)) {
      for (const block of content) {
        if (block && block.type === 'image' && typeof block.data === 'string' && block.data) {
          return block.data;
        }
      }
    }
    return null;
  }

  function extractInfoFields(info) {
    if (!info || typeof info !== 'object') return;
    const target = state.device && info[state.device] && typeof info[state.device] === 'object'
      ? info[state.device]
      : info;
    if (typeof target.package === 'string') state.lastPackage = target.package;
    if (typeof target.activity === 'string') state.lastActivity = target.activity;
  }

  function onToolResult(result, { fromSelf = false, deviceOverride = null } = {}) {
    if (!result || typeof result !== 'object') return;
    if (result.isError) {
      const text = Array.isArray(result.content)
        ? result.content.filter(b => b?.type === 'text').map(b => b.text).join('\n')
        : 'Command failed.';
      showNotice('Simulator error', text || 'Command failed.');
      setStatus('Error');
      syncControls();
      return;
    }
    clearNotice();
    const meta = result._meta?.[RESULT_META];
    const structured = result.structuredContent || {};

    if (meta && typeof meta === 'object') {
      if (typeof meta.simulator === 'string') state.simulatorId = meta.simulator;
      if (typeof meta.apk === 'string' && meta.apk) state.appName = meta.apk;
      if (Array.isArray(meta.devices) && meta.devices.length) state.devices = meta.devices;
      if (!deviceOverride && typeof meta.device === 'string' && meta.device) {
        state.device = meta.device;
      }
      if (typeof meta.running === 'boolean') state.running = meta.running;
      if (typeof meta.action === 'string') state.lastAction = meta.action;
    }
    if (typeof structured.simulator === 'string') {
      state.simulatorId = structured.simulator;
      state.running = true;
    }
    if (typeof structured.stopped === 'string') {
      state.running = false;
      setStatus(`Stopped ${structured.stopped}`);
    }
    if (structured.info) {
      extractInfoFields(structured.info);
    }
    if (structured.result && typeof structured.result === 'object') {
      extractInfoFields(structured.result);
    }
    if (Array.isArray(structured.events)) {
      appendEvents(structured.events);
    }
    if (Array.isArray(structured.lines)) {
      state.logs = structured.lines;
      renderDrawer();
    }

    const multiShots =
      meta?.screenshots && typeof meta.screenshots === 'object' ? meta.screenshots : null;
    let renderedAny = false;
    if (multiShots) {
      for (const [dev, b64] of Object.entries(multiShots)) {
        if (typeof b64 === 'string' && b64) {
          setImageBase64(b64, dev || null);
          renderedAny = true;
        }
      }
    }
    const imgDevice = deviceOverride || meta?.device || state.device;
    const png = renderedAny ? null : extractPngFromResult(result);
    if (png) {
      setImageBase64(png, imgDevice);
      renderedAny = true;
    }
    if (renderedAny) {
      setStatus(state.lastActivity ? state.lastActivity.split('.').pop() : 'Ready');
    } else if (state.running && !fromSelf && meta?.action !== 'logs') {
      // Quietly pull fresh screenshot(s) after launch without showing an error banner
      // if the host disabled app-initiated screenshot calls.
      void refreshScreenshot({ quiet: true });
    } else if (!state.running && typeof structured.stopped === 'string') {
      setStatus(`Stopped ${structured.stopped}`);
    }

    syncControls();
    renderDrawer();
  }

  // ---------------------------------------------------------------------------------------------
  // Tool calls (MCP Apps postMessage OR HTTP sidebar bridge)
  // ---------------------------------------------------------------------------------------------

  function simArgs(extra = {}, deviceOverride = undefined) {
    const args = { ...extra };
    if (state.simulatorId) args.simulator = state.simulatorId;
    const targetDevice = deviceOverride !== undefined ? deviceOverride : state.device;
    if (targetDevice) args.device = targetDevice;
    return args;
  }

  let selectionEpoch = 0;
  let pendingRefresh = false;

  async function callToolHttp(name, args) {
    const simId = args.simulator || state.simulatorId;
    if (!simId) throw new Error('No simulator selected');
    const encodedId = encodeURIComponent(simId);
    let url = '';
    let options = { cache: 'no-store', headers: httpHeaders() };

    if (name === 'simulator_screenshot') {
      const qs = new URLSearchParams();
      if (args.device) qs.set('device', args.device);
      url = `${apiBase}/${encodedId}/screenshot${qs.toString() ? `?${qs}` : ''}`;
      options.method = 'GET';
    } else if (name === 'simulator_logs') {
      const qs = new URLSearchParams();
      if (args.device) qs.set('device', args.device);
      if (args.lines) qs.set('lines', String(args.lines));
      url = `${apiBase}/${encodedId}/logs${qs.toString() ? `?${qs}` : ''}`;
      options.method = 'GET';
    } else {
      const actionMap = {
        simulator_command: 'command',
        simulator_reload: 'reload',
        simulator_restart: 'restart',
        simulator_stop: 'stop',
      };
      const action = actionMap[name];
      if (!action) throw new Error(`Unsupported HTTP bridge tool: ${name}`);
      url = `${apiBase}/${encodedId}/${action}`;
      options.method = 'POST';
      options.headers = httpHeaders({ 'Content-Type': 'application/json' });
      options.body = JSON.stringify(args);
    }

    const res = await fetch(url, options);
    const data = await res.json().catch(() => null);
    if (!data) throw new Error(`HTTP ${res.status}`);
    if (!res.ok && !data.isError) {
      throw new Error(data.error || `HTTP ${res.status}`);
    }
    return data;
  }

  async function callTool(name, args) {
    if (!initialized) throw new Error('Host bridge is not initialized');
    if (isHttpTransport) return callToolHttp(name, args);
    return request('tools/call', { name, arguments: args });
  }

  async function pollHttpSimulators() {
    if (!isHttpTransport) return;
    const epoch = selectionEpoch;
    try {
      const res = await fetch(apiBase, { cache: 'no-store', headers: httpHeaders() });
      if (!res.ok || epoch !== selectionEpoch) return;
      const data = await res.json();
      if (epoch !== selectionEpoch) return;
      const list = Array.isArray(data?.simulators) ? data.simulators : [];
      state.simulators = list;
      syncSimPicker();

      if (!list.length) {
        if (state.running) {
          state.running = false;
          state.simulatorId = null;
          state.devices = [];
          state.device = null;
          setStatus('No running simulator');
          syncControls();
        } else {
          setStatus('Waiting for simulator…');
        }
        return;
      }

      const current = list.find(s => s.id === state.simulatorId) || list[0];
      const changed = current.id !== state.simulatorId || !state.running;
      state.simulatorId = current.id;
      state.appName = current.apk || current.id;
      state.devices = Array.isArray(current.devices) ? current.devices : [];
      if (state.devices.length && !state.devices.includes(state.device)) {
        state.device = state.devices[0];
      }
      state.running = Boolean(current.running);
      if (current.info) extractInfoFields(current.info);
      syncControls();

      if (changed && !busy) {
        await refreshScreenshot({ quiet: true });
        if (!liveTimer && state.running) {
          startLive();
        }
      }
    } catch {
      // bridge may be restarting
    }
  }

  async function captureAllDevices(epoch = selectionEpoch) {
    const targets = isPaired() ? state.devices : [state.device || null];
    for (const dev of targets) {
      if (epoch !== selectionEpoch) return;
      const res = await callTool('simulator_screenshot', simArgs({}, dev));
      if (epoch !== selectionEpoch) return;
      if (res && !res.isError) state.running = true;
      onToolResult(res, { fromSelf: true, deviceOverride: dev });
    }
  }

  function flushPendingRefresh() {
    if (pendingRefresh && state.running && !busy) {
      pendingRefresh = false;
      void refreshScreenshot({ quiet: true });
    }
  }

  async function refreshScreenshot({ quiet = false } = {}) {
    if ((!state.running && quiet) || busy || !initialized) return;
    const epoch = selectionEpoch;
    busy = true;
    if (!quiet) setStatus('Capturing…');
    syncControls();
    try {
      await captureAllDevices(epoch);
    } catch (err) {
      if (epoch !== selectionEpoch) return;
      if (quiet && isPermissionOrDisabledError(err)) {
        setStatus('Live view available in Simulator sidebar');
      } else {
        if (!quiet) showNotice('Screenshot failed', err.message);
        setStatus('Error');
      }
    } finally {
      busy = false;
      syncControls();
      flushPendingRefresh();
    }
  }

  async function sendCommand(cmd, extra = {}, label = cmd, targetDevice = undefined) {
    if (!state.running || busy) return;
    if (targetDevice && isPaired()) {
      selectActiveDevice(targetDevice);
    }
    const epoch = selectionEpoch;
    busy = true;
    setStatus(`${label}…`);
    syncControls();
    try {
      const res = await callTool('simulator_command', simArgs({ cmd, ...extra }, targetDevice));
      if (epoch !== selectionEpoch) return;
      state.lastAction = targetDevice ? `${targetDevice}: ${label}` : label;
      onToolResult(res, { fromSelf: true, deviceOverride: targetDevice || null });
      updateModelContext();
      if (!res?.isError && state.running) {
        await captureAllDevices(epoch);
      }
    } catch (err) {
      if (epoch !== selectionEpoch) return;
      showNotice(`${label} failed`, err.message);
      setStatus('Error');
    } finally {
      busy = false;
      syncControls();
      flushPendingRefresh();
    }
  }

  async function runLifecycle(toolName, label) {
    if (!state.running || busy) return;
    const epoch = selectionEpoch;
    busy = true;
    setStatus(`${label}…`);
    syncControls();
    try {
      const res = await callTool(toolName, simArgs());
      if (epoch !== selectionEpoch) return;
      state.lastAction = label;
      onToolResult(res, { fromSelf: true });
      updateModelContext();
      if (toolName !== 'simulator_stop' && !res?.isError && state.running) {
        await captureAllDevices(epoch);
      }
    } catch (err) {
      if (epoch !== selectionEpoch) return;
      showNotice(`${label} failed`, err.message);
      setStatus('Error');
    } finally {
      busy = false;
      syncControls();
      flushPendingRefresh();
    }
  }

  function startLive() {
    if (liveTimer) return;
    btnLive.classList.add('active');
    btnLive.setAttribute('aria-pressed', 'true');
    liveTimer = setInterval(() => {
      if (document.visibilityState === 'hidden') return;
      if (state.running && !busy) void refreshScreenshot({ quiet: true });
    }, LIVE_POLL_MS);
  }

  function stopLive() {
    if (liveTimer) {
      clearInterval(liveTimer);
      liveTimer = null;
    }
    btnLive.classList.remove('active');
    btnLive.setAttribute('aria-pressed', 'false');
  }

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && liveTimer && state.running && !busy) {
      void refreshScreenshot({ quiet: true });
    }
  });

  // ---------------------------------------------------------------------------------------------
  // Pointer gesture handling on each device screen
  // ---------------------------------------------------------------------------------------------

  function toDevicePoint(img, clientX, clientY) {
    const rect = img.getBoundingClientRect();
    if (!rect.width || !rect.height || !img.naturalWidth || !img.naturalHeight) {
      return null;
    }
    const relX = Math.max(0, Math.min(rect.width, clientX - rect.left));
    const relY = Math.max(0, Math.min(rect.height, clientY - rect.top));
    return {
      x: Math.round((relX / rect.width) * img.naturalWidth),
      y: Math.round((relY / rect.height) * img.naturalHeight),
      cssX: relX,
      cssY: relY,
    };
  }

  function showRipple(wrap, cssX, cssY) {
    const el = document.createElement('div');
    el.className = 'ripple';
    el.style.left = `${cssX}px`;
    el.style.top = `${cssY}px`;
    wrap.appendChild(el);
    setTimeout(() => el.remove(), 480);
  }

  function attachPointerHandlers(img, wrap, deviceKey) {
    const targetDevice = deviceKey === DEFAULT_DEVICE_KEY ? undefined : deviceKey;

    img.addEventListener('pointerdown', event => {
      if (event.button !== 0 || !state.running || busy) return;
      const pt = toDevicePoint(img, event.clientX, event.clientY);
      if (!pt) return;
      if (targetDevice) selectActiveDevice(targetDevice);
      dragStart = {
        ...pt,
        clientX: event.clientX,
        clientY: event.clientY,
        time: Date.now(),
        shiftKey: event.shiftKey,
        pointerId: event.pointerId,
        deviceKey,
      };
      img.setPointerCapture(event.pointerId);
    });

    img.addEventListener('pointerup', event => {
      if (!dragStart || event.pointerId !== dragStart.pointerId || dragStart.deviceKey !== deviceKey) return;
      const start = dragStart;
      dragStart = null;
      const end = toDevicePoint(img, event.clientX, event.clientY);
      if (!end) return;
      const dist = Math.hypot(event.clientX - start.clientX, event.clientY - start.clientY);
      const heldMs = Date.now() - start.time;
      showRipple(wrap, end.cssX, end.cssY);
      const prefix = targetDevice ? `[${targetDevice}] ` : '';
      if (dist >= DRAG_THRESHOLD_PX) {
        hintEl.textContent = `${prefix}Swiped (${start.x}, ${start.y}) → (${end.x}, ${end.y})`;
        void sendCommand(
          'swipe',
          { x1: start.x, y1: start.y, x2: end.x, y2: end.y, durationMs: 250 },
          `swipe (${start.x},${start.y})→(${end.x},${end.y})`,
          targetDevice,
        );
      } else if (start.shiftKey || heldMs >= LONG_PRESS_MS) {
        hintEl.textContent = `${prefix}Long-pressed (${end.x}, ${end.y})`;
        void sendCommand(
          'longPress',
          { x: end.x, y: end.y },
          `longPress (${end.x},${end.y})`,
          targetDevice,
        );
      } else {
        hintEl.textContent = `${prefix}Tapped (${end.x}, ${end.y})`;
        void sendCommand(
          'tap',
          { x: end.x, y: end.y },
          `tap (${end.x},${end.y})`,
          targetDevice,
        );
      }
    });

    img.addEventListener('pointercancel', () => {
      dragStart = null;
    });
  }

  // ---------------------------------------------------------------------------------------------
  // Button handlers
  // ---------------------------------------------------------------------------------------------

  btnBack.addEventListener('click', () => void sendCommand('back', {}, 'Back'));
  btnHome.addEventListener('click', () => void sendCommand('home', {}, 'Home'));
  btnRefresh.addEventListener('click', () => void refreshScreenshot());
  btnLive.addEventListener('click', () => {
    if (liveTimer) stopLive();
    else startLive();
  });
  btnReload.addEventListener('click', () => void runLifecycle('simulator_reload', 'Reloading'));
  btnRestart.addEventListener('click', () => void runLifecycle('simulator_restart', 'Restarting'));
  btnStop.addEventListener('click', () => void runLifecycle('simulator_stop', 'Stopping'));

  btnEnter.addEventListener('click', () => void sendCommand('key', { key: 'ENTER' }, 'Enter'));
  textForm.addEventListener('submit', event => {
    event.preventDefault();
    const value = textInput.value;
    if (!value) return;
    textInput.value = '';
    void sendCommand('text', { text: value }, `text`);
  });

  btnLogs.addEventListener('click', async () => {
    if (!state.running || busy) return;
    busy = true;
    setStatus('Loading logs…');
    syncControls();
    try {
      const res = await callTool('simulator_logs', simArgs({ lines: 80 }));
      onToolResult(res, { fromSelf: true });
      setStatus('Logs loaded');
    } catch (err) {
      showNotice('Logs failed', err.message);
      setStatus('Error');
    } finally {
      busy = false;
      syncControls();
    }
  });

  btnAsk.addEventListener('click', () => {
    if (!initialized || !state.simulatorId || isHttpTransport) return;
    const target = state.device ? ` (${state.device})` : '';
    request('ui/message', {
      role: 'user',
      content: [
        {
          type: 'text',
          text: `Inspect the current Android Simulator screen for ${state.simulatorId}${target} and describe what you see.`,
        },
      ],
    }).catch(err => showNotice('Message failed', err.message));
  });

  simSelect.addEventListener('change', () => {
    const picked = state.simulators.find(s => s.id === simSelect.value);
    if (!picked) return;
    selectionEpoch++;
    state.simulatorId = picked.id;
    state.appName = picked.apk || picked.id;
    state.devices = Array.isArray(picked.devices) ? picked.devices : [];
    state.device = state.devices[0] || null;
    state.running = Boolean(picked.running);
    syncControls();
    if (busy) {
      pendingRefresh = true;
    } else {
      void refreshScreenshot();
    }
  });

  deviceSelect.addEventListener('change', () => {
    selectActiveDevice(deviceSelect.value);
    if (!isPaired()) {
      void refreshScreenshot();
    }
  });

  syncControls();
  void initializeBridge();
})();
</script>
</body>
</html>
